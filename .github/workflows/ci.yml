name: CI
on:
  pull_request:
  push:
    branches: [main, 'hardening/**']
permissions:
  contents: read
concurrency:
  group: rl-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm test
      - run: npm run test:ui --prefix client
      - name: Test MongoDB unique UID under concurrency
        run: node --test tests/integration/linkMongo.test.js
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/rl_security_test
      - run: npm run build --prefix client
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      - name: Build container
        run: docker build --build-arg VITE_FIREBASE_API_KEY="${{ vars.VITE_FIREBASE_API_KEY }}" -t rl-ci:${{ github.sha }} .
      - name: Test container health and readiness
        run: |
          docker run -d --name rl-test -e MONGODB_URI=mongodb://127.0.0.1:27017/test -e JWT_SECRET=test -e FIREBASE_PROJECT_ID=test rl-ci:${{ github.sha }}
          for n in $(seq 1 30); do docker exec rl-test node -e "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break; sleep 1; done
          docker exec rl-test node -e "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1))"
          docker exec rl-test node -e "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.status===503?0:1))"
          docker exec rl-test node -e "fetch('http://localhost:3000/about').then(r=>process.exit(r.ok?0:1))"
      - if: always()
        run: docker rm -f rl-test || true
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix client --audit-level=high
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gradus-technologies/rl:${{ github.sha }}
          build-args: VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
